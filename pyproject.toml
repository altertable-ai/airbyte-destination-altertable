[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "airbyte-destination-altertable"
version = "0.1.0"
description = "Altertable's Airbyte destination"
authors = ["Altertable <contact@altertable.ai>"]
license = "MIT"
readme = "README.md"
packages = [{include = "destination_altertable"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
airbyte-cdk = ">=6.51.0"
altertable-flightsql = ">=0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.14"
testcontainers = ">=4.0"

[tool.poetry.scripts]
destination-altertable = "main:main"
