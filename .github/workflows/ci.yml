name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run unit tests
        run: poetry run pytest unit_tests/ -v

  integration-tests:
    runs-on: ubuntu-latest

    services:
      altertable-mock:
        image: ghcr.io/altertable-ai/altertable-mock:latest
        ports:
          - 15002:15002
        env:
          ALTERTABLE_MOCK_FLIGHT_PORT: "15002"
          ALTERTABLE_MOCK_USERS: "altertable-test:lk_test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration tests
        env:
          ALTERTABLE_HOST: localhost
          ALTERTABLE_PORT: "15002"
          ALTERTABLE_USERNAME: altertable-test
          ALTERTABLE_PASSWORD: lk_test
          ALTERTABLE_TLS: "false"
        run: poetry run pytest integration_tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint with ruff
        run: |
          poetry run ruff format --check destination_altertable/ main.py scripts/
          poetry run ruff check destination_altertable/ main.py scripts/
